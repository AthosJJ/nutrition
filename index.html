<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Coach Nutrition</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Nutrition" />
  <meta name="theme-color" content="#fbf7ef" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Sections (show/hide via JS) -->
    <section id="section-aujourdhui" class="tab-section is-active" role="main">
      <div class="section-inner" id="content-aujourdhui">
        <div class="loading-state">Chargement…</div>
      </div>
    </section>

    <section id="section-semaine" class="tab-section" hidden role="main">
      <div class="section-inner" id="content-semaine"></div>
    </section>

    <section id="section-recettes" class="tab-section" hidden role="main">
      <div class="section-inner" id="content-recettes"></div>
    </section>

    <section id="section-courses" class="tab-section" hidden role="main">
      <div class="section-inner" id="content-courses"></div>
    </section>

    <!-- Recipe detail overlay -->
    <div id="detail-overlay" class="detail-overlay" aria-hidden="true" hidden>
      <div class="section-inner" id="content-detail"></div>
    </div>

    <!-- Export ratings sheet -->
    <div id="export-sheet" class="sheet-overlay" hidden>
      <div class="sheet-backdrop" data-export-close></div>
      <div class="sheet" role="dialog" aria-label="Exporter mes notes">
        <div class="sheet-head">
          <h2 class="sheet-title">Mes notes</h2>
          <button class="sheet-close" type="button" data-export-close aria-label="Fermer">✕</button>
        </div>
        <p class="sheet-sub">À copier pour ton agent qui prépare les repas.</p>
        <textarea id="export-text" class="export-text" readonly></textarea>
        <div class="sheet-actions">
          <button class="sheet-btn primary" id="export-copy-text" type="button">Copier le texte</button>
          <button class="sheet-btn" id="export-copy-json" type="button">Copier le JSON</button>
        </div>
      </div>
    </div>

    <!-- Tab bar -->
    <nav class="tab-bar" role="navigation" aria-label="Navigation principale">
      <button class="tab is-active" data-tab="aujourdhui" aria-current="page">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="4.4" stroke="currentColor" stroke-width="1.8"/>
          <line x1="12" y1="2.4" x2="12" y2="4.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="12" y1="19.4" x2="12" y2="21.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="2.4" y1="12" x2="4.6" y2="12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="19.4" y1="12" x2="21.6" y2="12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="5.3" y1="5.3" x2="6.9" y2="6.9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="17.1" y1="17.1" x2="18.7" y2="18.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="5.3" y1="18.7" x2="6.9" y2="17.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="17.1" y1="6.9" x2="18.7" y2="5.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span class="tab-label">Aujourd'hui</span>
      </button>
      <button class="tab" data-tab="semaine">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3.5" y="5.5" width="17" height="14.5" rx="3.5" stroke="currentColor" stroke-width="1.8"/>
          <line x1="3.5" y1="9.5" x2="20.5" y2="9.5" stroke="currentColor" stroke-width="1.8"/>
          <line x1="8" y1="3" x2="8" y2="6.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="16" y1="3" x2="16" y2="6.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span class="tab-label">Semaine</span>
      </button>
      <button class="tab" data-tab="recettes">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5.5 5.5h10a3 3 0 0 1 3 3v10h-10a3 3 0 0 1-3-3v-10z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <line x1="9" y1="5.5" x2="9" y2="18.5" stroke="currentColor" stroke-width="1.8"/>
        </svg>
        <span class="tab-label">Recettes</span>
      </button>
      <button class="tab" data-tab="courses">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4.5 8h15l-1.4 8.4a2 2 0 0 1-2 1.6H7.9a2 2 0 0 1-2-1.6L4.5 8z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M8 8V6.5a4 4 0 0 1 8 0V8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span class="tab-label">Courses</span>
      </button>
    </nav>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js'));
    }
  </script>
</body>
</html>
